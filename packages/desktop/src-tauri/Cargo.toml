[package]
name = "tadori-desktop"
version = "0.2.1"
description = "tadori のデスクトップアプリ"
edition = "2021"
publish = false

[lib]
name = "tadori_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# フォルダ選びのダイアログ（Tauri 公式プラグイン・MIT/Apache-2.0）。md-business と同じもの
tauri-plugin-dialog = "2"
# 正本（https の文書・課題）を OS の既定のブラウザで開く（Tauri 公式プラグイン・MIT/Apache-2.0）。窓の中で外のページへ移らないように
tauri-plugin-opener = "2"
# OS の言語を読む（ダイアログとエラーの文を英語／日本語で出すため。MIT/Apache-2.0、依存が小さい）
sys-locale = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
