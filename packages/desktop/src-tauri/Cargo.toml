[package]
name = "tadori-desktop"
version = "0.1.0"
description = "tadori のデスクトップアプリ"
edition = "2021"
publish = false

[lib]
name = "tadori_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# フォルダ選びのダイアログ（Tauri 公式プラグイン・MIT/Apache-2.0）。md-business と同じもの
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
