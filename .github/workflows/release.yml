name: release

# デスクトップアプリのインストーラーを、OS と CPU ごとに作る。
# 人が v で始まるタグ（例：v0.1.0）を push したときだけ走り、下書きのリリースに付ける。
# 下書きを公開するのは人（中身を確かめてから）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # インストーラーを作る前に、単体のテスト・画面のテスト・出す前の試験を全部通す。
  # 通らない版は配らない（試験導入している人に、壊れたものを先に見つけさせないため）
  harness:
    name: 出す前の試験
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 依存を入れる
        run: pnpm install --frozen-lockfile
      - name: 建てる
        run: pnpm -r --filter '!@tadori/desktop' build
      - name: 型と単体のテスト
        run: pnpm -r --filter '!@tadori/desktop' typecheck && pnpm -r --filter '!@tadori/desktop' test
      - name: 画面のテスト
        run: pnpm --filter @tadori/ui exec playwright install --with-deps chromium && pnpm --filter @tadori/ui e2e
      - name: 出す前の試験（組んだ CLI・MCP・serve を本物のプロセスで動かす）
        run: pnpm exec vitest run --config harness/vitest.config.ts

  installers:
    needs: harness
    name: ${{ matrix.name }}
    permissions:
      contents: write # 下書きのリリースにインストーラーを付けるため
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（Apple シリコン）
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS（Intel）
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows（x64・Intel / AMD）
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - name: Windows（ARM）
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版はリポジトリの package.json の packageManager に合わせる

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      - name: インストーラーに入れる写しで、出す前の試験を流す（この OS の上で）
        run: pnpm -r --filter '!@tadori/desktop' build && node harness/bundle.mjs

      # Mac の署名と公証。証明書（.p12）の Secret が入っているときだけ効く（無ければ、これまでどおり署名なしで作る）。
      # 公証は App Store Connect の API キー（.p8）で行う。鍵はファイルにして渡し、ログには出さない
      - name: Mac の署名と公証の材料を用意する（証明書の Secret があるときだけ）
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "証明書の Secret（APPLE_CERTIFICATE）が無いので、署名せずに作ります"
            exit 0
          fi
          for name in API_KEY_P8 CERTIFICATE_PASSWORD SIGNING_IDENTITY API_KEY API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::証明書はあるのに、APPLE_${name} の Secret がありません"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          # 値が空のまま渡すと、作る道具が空の証明書を読もうとするので、揃ったときだけ渡す（Secret の値はログでは伏せ字になる）
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: インストーラーを作り、下書きのリリースに付ける
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: tadori ${{ github.ref_name }}
          releaseBody: |
            tadori のデスクトップアプリです。Node.js 22 以上が入った PC で動きます。
            - macOS：Apple シリコンは aarch64、Intel は x64 の .dmg
            - Windows：x64（Intel / AMD）・ARM（arm64）とも .msi か .exe
            macOS 版は Apple の Developer ID で署名し、公証（notarization）を受けています。Windows 版はまだ署名がなく、初めて開くとき OS やウイルス対策ソフトが確認を求めることがあります。
          releaseDraft: true
          prerelease: false

      # 署名の材料があるのに、できたアプリが署名・公証されていなければ、ここで止める（署名したつもりで配らない）
      - name: Mac のアプリが署名・公証されたかを確かめる（署名の材料があるときだけ）
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          app=$(find packages/desktop/src-tauri/target -maxdepth 6 -type d -path '*/bundle/macos/*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::できた .app が見つかりません"
            exit 1
          fi
          echo "確かめるアプリ：$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
